
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="icon" href="data:,">
</head>
<body>

    <h1>ini belajar js</h1>

    <script>
        // Code JavaScript

        // Variabel dan tipe data
        const nama = "kasman";
        let umur = 99;
        let nilai = 100;
        let aktif = true;

        console.log("nama", nama);
        console.log("umur", umur);
        console.log("nilai", nilai);
        console.log("aktif", aktif);
        console.log("tipe nilai", typeof nilai);

        // Operator aritmetika
        const tugas = 80;
        const uts = 78;
        const uas = 95;

        const akhir = tugas * 0.30 + uts * 0.30 + uas * 0.40;

        console.log("nilai akhir", akhir);

        // Operator perbandingan
        console.log("nilai >= 60", akhir >= 60);

        // Percabangan
        if (akhir >= 80) {
            console.log("Grade A");
        } else if (akhir >= 70) {
            console.log("Grade B");
        } else if (akhir >= 60) {
            console.log("Grade C");
        } else {
            console.log("Grade D");
        }

        // Perulangan
        for (let i = 1; i <= 5; i++) {
            console.log("Perulangan ke-", i);
        }

        // Fungsi sederhana
        function hitungLuas(panjang, lebar) {
            return panjang * lebar;
        }

        console.log("Luas:", hitungLuas(10, 5));

        // Praktikum Mandiri Pengolah Nilai Mahasiswa
        const namaMahasiswa = "Kasman";
        const nilaiTugas = 90;
        const nilaiUts = 80;
        const nilaiUas = 90;

        const nilaiAkhir =
            nilaiTugas * 0.30 +
            nilaiUts * 0.30 +
            nilaiUas * 0.40;

        let statusKelulusan;

        if (nilaiAkhir >= 60) {
            statusKelulusan = "LULUS";
        } else {
            statusKelulusan = "TIDAK LULUS";
        }

        console.log("=== Pengolah Nilai Mahasiswa ===");
        console.log("Nama Mahasiswa:", namaMahasiswa);
        console.log("Nilai Akhir:", nilaiAkhir);
        console.log("Status Kelulusan:", statusKelulusan);

    </script>

</body>
</html>
